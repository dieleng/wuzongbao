<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>项目管理 · 后台</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%235b8cff'/><text x='50' y='70' font-size='54' text-anchor='middle' fill='white' font-family='monospace'>P</text></svg>">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav class="nav">
    <div class="container nav-inner">
        <a class="logo" href="/admin">后台<span>.admin</span></a>
        <div class="nav-links">
            <a href="/" target="_blank">查看站点</a>
            <a href="#" id="logoutBtn">退出登录</a>
        </div>
    </div>
</nav>

<section class="container section">
    <div class="dash-head">
        <h2>项目管理</h2>
        <a class="btn" href="/admin/projects/new">+ 新建项目</a>
    </div>

    <p class="empty" th:if="${#lists.isEmpty(projects)}">
        还没有项目,点右上角「新建项目」发布你的第一个作品。
    </p>

    <table class="table" th:unless="${#lists.isEmpty(projects)}">
        <thead>
        <tr>
            <th>标题</th>
            <th>标签</th>
            <th>状态</th>
            <th>权重</th>
            <th>更新时间</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${projects}">
            <td>
                <a class="table-title" th:href="@{'/admin/projects/' + ${p.id} + '/edit'}" th:text="${p.title}">标题</a>
            </td>
            <td class="muted" th:text="${p.tags}"></td>
            <td>
                <span class="badge" th:classappend="${p.published} ? 'badge-ok' : 'badge-draft'"
                      th:text="${p.published} ? '已发布' : '草稿'">已发布</span>
            </td>
            <td th:text="${p.sortWeight}">0</td>
            <td class="muted" th:text="${p.updatedAtText}">2026-01-01 00:00</td>
            <td class="ops">
                <a class="link" th:href="@{'/admin/projects/' + ${p.id} + '/edit'}">编辑</a>
                <a class="link" th:if="${p.published}" th:href="@{'/project/' + ${p.id}}" target="_blank">预览</a>
                <a class="link danger js-delete" href="#"
                   th:attr="data-id=${p.id}, data-title=${p.title}">删除</a>
            </td>
        </tr>
        </tbody>
    </table>
</section>

<script src="/js/admin.js"></script>
</body>
</html>
