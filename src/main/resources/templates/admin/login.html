<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 · 后台管理</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%235b8cff'/><text x='50' y='70' font-size='54' text-anchor='middle' fill='white' font-family='monospace'>P</text></svg>">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-body">

<div class="login-card">
    <h1>后台管理</h1>
    <p class="login-tip">仅站长可见,用于发布和管理作品</p>
    <form id="loginForm">
        <label>用户名
            <input type="text" name="username" autocomplete="username" required>
        </label>
        <label>密码
            <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <p class="login-err" id="loginErr"></p>
        <button type="submit" class="btn block">登 录</button>
    </form>
</div>

<script src="/js/admin.js"></script>
</body>
</html>
